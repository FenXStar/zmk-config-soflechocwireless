# This file generates the GitHub Actions matrix.
#
# Firmware variants (see each artifact zip before flashing!):
#
# Primary setup (Prospector = the radio/central; see also the nice_oled screen module in west.yml):
#   - soflechoc_left / soflechoc_right : both halves are BLE peripherals,
#     OLED shows the nice_oled peripheral screen (battery + crystal animation;
#     switch to pokemon/spaceman via cmake-args in the include below)
#   - soflechoc_dongle_prospector      : Prospector = the only central/USB-HID
#
# FALLBACK 1 — no dongle at all:
#   - soflechoc_left_central : left half becomes the central; plug its USB-C
#     into the PC (or use its Bluetooth directly), right half pairs to it.
#     Flash this instead of soflechoc_left. Do NOT run it together with a
#     dongle firmware — two centrals cannot coexist.
#
# FALLBACK 2 — Prospector broken / spare cheap dongle:
#   - soflechoc_dongle_xiao / soflechoc_dongle_nice_nano : same central
#     firmware without the screen module, for a bare XIAO nRF52840 or
#     nice!nano dongle. Halves are unchanged (peripheral firmware).
---
include:
  # ---- primary: Prospector dongle is the central ----
  # nice_oled = zzuse/zmk-nice-oled-zz screen for the 128x32 SSD1306 (see west.yml)
  - board: nice_nano//zmk
    shield: soflechoc_left nice_oled
    cmake-args: -DCONFIG_NICE_OLED_PERIPHERAL_CRYSTAL=y
  - board: nice_nano//zmk
    shield: soflechoc_right nice_oled
    cmake-args: -DCONFIG_NICE_OLED_POKEMON_ANIMATION=y
  - board: xiao_ble//zmk
    shield: soflechoc_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y -DCONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n -DCONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80 -DCONFIG_LV_Z_VDB_SIZE=25
    artifact-name: soflechoc_dongle_prospector

  # ---- fallback 1: left half as central (USB/BLE direct, no dongle) ----
  # no PERIPHERAL_CRYSTAL here: as the central it shows the full Luna/WPM screen
  - board: nice_nano//zmk
    shield: soflechoc_left nice_oled
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
    artifact-name: soflechoc_left_central

  # ---- fallback 2: plain dongles (no screen) ----
  - board: xiao_ble//zmk
    shield: soflechoc_dongle
    snippet: studio-rpc-usb-uart
    artifact-name: soflechoc_dongle_xiao
  - board: nice_nano//zmk
    shield: soflechoc_dongle
    snippet: studio-rpc-usb-uart
    artifact-name: soflechoc_dongle_nice_nano

  # ---- factory-reset images ----
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: soflechoc_settings_reset_nice_nano
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: soflechoc_settings_reset_xiao
