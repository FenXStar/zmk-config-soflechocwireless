# Sofle (nice!nano nRF52840) — OLED + encoders + RGB underglow + ZMK Studio

# SSD1306 OLED displays on both halves
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Rotaries (encoders)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB underglow (WS2812 on D6)
CONFIG_ZMK_RGB_UNDERGLOW=y
# Keep external power (and thus the OLEDs) on when underglow is off
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50

# Live keymap editing via the ZMK Studio app
CONFIG_ZMK_STUDIO=y

CONFIG_ZMK_SLEEP=y

# Prospector settings
CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
CONFIG_LV_Z_VDB_SIZE=25