# Sofle (nice!nano nRF52840) — OLED + encoders + RGB underglow + ZMK Studio

# SSD1306 OLED displays on both halves
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Rotaries (encoders)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB underglow (WS2812 on D6)
CONFIG_ZMK_RGB_UNDERGLOW=y
# Keep external power (and thus the OLEDs) on when underglow is off
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_WS2812_STRIP=y

# Live keymap editing via the ZMK Studio app
CONFIG_ZMK_STUDIO=y

# Power savings: turn the OLEDs off when idle, wake them on keypress
CONFIG_ZMK_BEHAVIORS_POWER_SAVE_SUSPEND=y
CONFIG_PM_DEVICE=y
