manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: carrefinho
      url-base: https://github.com/carrefinho
    - name: zzuse
      url-base: https://github.com/zzuse
  projects:
    - name: zmk
      remote: zmkfirmware
      # NOTE: the prospector-zmk-module branch used below only supports the
      # Zephyr 4.1 based ZMK main. If main breaks, switch prospector-zmk-module
      # to its main branch and pin zmk to a tag (e.g. revision: v0.3.1).
      revision: main
      import: app/west.yml
    - name: prospector-zmk-module
      remote: carrefinho
      revision: feat/new-status-screens
    # Rich OLED (128x32 SSD1306) status screens for the halves: layer/battery/
    # output/modifier widgets, Luna WPM widget (central), crystal/pokemon
    # animations (peripheral). Its main branch tracks current ZMK main.
    - name: zmk-nice-oled-zz
      remote: zzuse
      revision: main
  self:
    path: config
