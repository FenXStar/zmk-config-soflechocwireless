# Sofle Choc (PandaKB) — shared config
#
# This file is applied to ALL builds (left, right, dongle).
# Board/shield-specific options live in boards/shields/soflechoc/*.conf.

# Live keymap editing via the ZMK Studio app (dongle exposes the USB RPC)
CONFIG_ZMK_STUDIO=y

# Mouse emulation (HID wheel events for the right encoder via &msc).
# Sensor bindings always run on the central, so the dongle build needs this;
# enabled on every build so the left_central fallback scrolls too.
CONFIG_ZMK_POINTING=y
