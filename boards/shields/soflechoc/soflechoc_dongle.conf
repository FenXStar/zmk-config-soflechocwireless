# Sofle Choc dongle (Prospector, XIAO nRF52840) — BLE central

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# USB-powered, no battery: never sleep
CONFIG_ZMK_SLEEP=n

# ZMK Studio over USB via the studio-rpc-usb-uart snippet (see build.yaml)
CONFIG_ZMK_STUDIO=y

# Prospector status screen
CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
CONFIG_LV_Z_VDB_SIZE=25
