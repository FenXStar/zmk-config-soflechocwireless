# Sofle Choc dongle (Prospector, XIAO nRF52840) — BLE central

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# USB-powered, no battery: never sleep
CONFIG_ZMK_SLEEP=n

# ZMK Studio over USB via the studio-rpc-usb-uart snippet (see build.yaml)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# RGB_TOG/HUE/EFF behaviors are global-locality: the central forwards them
# to the peripherals (halves) where the real LED strips live, but it must
# host the behavior locally first, which requires CONFIG_ZMK_RGB_UNDERGLOW
# and a (stub, unwired) zmk,underglow node — see soflechoc_dongle.overlay.
#CONFIG_ZMK_RGB_UNDERGLOW=y

# Prospector status screen
CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
CONFIG_LV_Z_VDB_SIZE=25
