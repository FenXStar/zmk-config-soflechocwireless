# Sofle Choc (PandaKB), right half — nice!nano

CONFIG_ZMK_DISPLAY=y

# External power rail feeds the OLEDs and RGB LEDs
CONFIG_ZMK_EXT_POWER=y

# EC11 rotary encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB per-key LEDs on the LED (SPI/WS2812) line
CONFIG_ZMK_RGB_UNDERGLOW=y
# Keep external power (and thus the OLED) on when underglow is off
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50

# Live keymap editing via the ZMK Studio app
CONFIG_ZMK_STUDIO=y

CONFIG_ZMK_SLEEP=y
